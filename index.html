<style>
:root{color-scheme:light;--green:#154e2a;--brown:#5a3216;--gold:#b28537;--paper:#f6f3eb;--line:#ded8ca}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--brown);font-family:Arial,Helvetica,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.wrap{max-width:1256px;margin:auto;padding:0 32px}.brand{display:flex;align-items:center;gap:14px;letter-spacing:.16em;font-size:13px;font-weight:800;color:var(--green)}.mark{width:31px;height:31px;color:var(--gold)}header{padding:42px 0 30px;border-bottom:1px solid var(--line)}h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;color:var(--green);font-size:clamp(32px,4.3vw,56px);line-height:1.08;letter-spacing:-.045em;margin:20px 0 28px;max-width:800px}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{border:1px solid var(--line);color:var(--green);padding:10px 18px;border-radius:24px;background:transparent;font-size:14px;font-weight:600}nav button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}main{padding-top:32px;padding-bottom:70px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 24px}.card{min-width:0;background:#fffdf8;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.card[hidden]{display:none}.card-top{padding:21px 22px 18px;min-height:110px}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#71624e;display:block;margin-bottom:8px}h2{font-size:21px;font-weight:650;line-height:1.2;margin:0;color:var(--green)}.preview{position:relative;aspect-ratio:9/16;background:#15251b;max-height:570px;overflow:hidden;margin:0 15px;border-radius:10px}.preview iframe,.preview video{position:absolute;width:100%;height:100%;border:0;inset:0;object-fit:contain}.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.play{position:absolute;inset:0;border:0;background:linear-gradient(transparent 60%,#0005);display:grid;place-items:center}.play svg{width:66px;height:66px;color:#fff;filter:drop-shadow(0 4px 12px #0006)}.play:hover svg{transform:scale(1.08)}.play svg{transition:transform .2s}.body{padding:18px 20px 22px;display:flex;flex-direction:column;flex:1}.downloads{display:grid;grid-template-columns:1fr 1fr;gap:8px}.download{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 6px;text-decoration:none;border:1px solid var(--green);border-radius:8px;font-size:12px;font-weight:700;line-height:1.3;text-align:center;background:var(--green);color:white}.download.secondary{color:var(--brown);background:transparent;border-color:var(--line)}.download svg{width:15px;height:15px;flex-shrink:0}.caption{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;flex:1;display:flex;flex-direction:column}.caption-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:11px}.caption-head span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:#74654f}.copy{background:transparent;border:1px solid var(--line);padding:7px 9px;border-radius:6px;font-size:11px;color:var(--green);font-weight:700}.caption p{font-size:14px;line-height:1.6;white-space:pre-line;margin:0;color:#554c3f}.caption p::selection{background:#e9d59e}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:40px;background:var(--green);color:white;font-size:14px;box-shadow:0 6px 25px #0002;z-index:20}.toast:empty{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:0 22px}}@media(max-width:580px){header{padding:28px 0 24px}.wrap{padding:0 16px}.grid{grid-template-columns:1fr;gap:22px}h1{font-size:38px;margin:16px 0 24px}nav{gap:6px}nav button{font-size:12px;padding:9px 13px}main{padding-top:22px}.card-top{min-height:auto;padding:20px}.preview{max-height:none}.download{font-size:13px}.caption p{font-size:15px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body>
<header><div class="wrap"><div class="brand"><svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M5 31C2 18 10 5 23 3c3 13-5 26-18 28Zm12 6c0-14 7-23 19-27 4 13-3 25-19 27Z" fill="currentColor"/><path d="M6 29 20 7M19 34l14-20" stroke="#f6f3eb" stroke-width="2"/></svg>CAPECA</div><h1>10º Concurso<br>Qualidade do Café</h1><nav aria-label="Filtrar vídeos"><button type="button" aria-pressed="true" data-filter="Todos">Todos</button><button type="button" aria-pressed="false" data-filter="Montagens">Montagens</button><button type="button" aria-pressed="false" data-filter="Depoimentos">Depoimentos</button><button type="button" aria-pressed="false" data-filter="Discursos">Discursos</button></nav></div></header>
<main class="wrap"><div class="grid" id="videos"></div></main><div class="toast" role="status" aria-live="polite"></div>
<script>
const items=[{"code": "M01", "title": "O café atravessa gerações", "category": "Montagens", "caption": "O café atravessa gerações. 💚\n\nNa lembrança do avô, no trabalho em família e no olhar de quem está começando, a mesma paixão continua. Histórias que se encontram e mostram a força da cafeicultura de Campos Altos.\n\n#CAPECA #SucessaoFamiliar #Cafeicultura #CamposAltos", "videoId": "1925VXjb9CGzvq3Xif-t2xvTzwNl2Wyl8", "coverId": "1J7_G3JxOwn5IZjE-AOsGXi8YF6S9JWIb"}, {"code": "M04", "title": "Da qualidade à renda", "category": "Montagens", "caption": "Da qualidade à valorização de quem produz. ☕\n\nO cuidado com o café abre portas: reconhecimento, novos mercados e mais oportunidades para a nossa região. Cada conquista no campo também fortalece Campos Altos.\n\n#CAPECA #CafeDeQualidade #CafesEspeciais #CamposAltos", "videoId": "1cmO2BqNLlP8fJNkj6JRscf3LcT_CKYdi", "coverId": "1QwNTvZp6hcVjkCc-ZHVo-c1TI7Qyp_1i"}, {"code": "M05", "title": "Parceria que faz acontecer", "category": "Montagens", "caption": "Parceria é fazer acontecer juntos. 💚\n\nCooperativas, empresas, colaboradores e produtores unidos por um propósito: valorizar o nosso café. O 10º Concurso Qualidade do Café é resultado dessa construção coletiva.\n\n#CAPECA #Cooperativismo #Cafeicultura #CamposAltos", "videoId": "17L_TJdDPxKMP6GGPy75PtxXImhtCxMH1", "coverId": "1zxyudQAdd1cWz6rYdFcv2dHG0uQKYsEw"}, {"code": "I01", "title": "Uma história de parceria", "category": "Depoimentos", "caption": "Uma parceria que cresce junto com a nossa história. ☕\n\nA Londe&Ribeiro celebra os produtores de Campos Altos e a dedicação de quem faz a qualidade acontecer. No 10º Concurso Qualidade do Café, cada conquista também é motivo de gratidão.\n\n#CAPECA #LondeERibeiro #CamposAltos #CafeDeQualidade", "videoId": "1n-uYmxeD-gCF5dgQ3fvje2L21YskRjqM", "coverId": "1oaJfM71V1YApiIuq643F5tJUn7usEI3f"}, {"code": "I02", "title": "Quem fez acontecer", "category": "Depoimentos", "caption": "Uma noite construída por muitas mãos. 💚\n\nNosso agradecimento à Syngenta, à Londe&Ribeiro, aos cooperados, produtores e colaboradores que fizeram o 10º Concurso Qualidade do Café acontecer. Essa conquista é de todos nós!\n\n#CAPECA #ConcursoQualidadeDoCafe #CamposAltos #Cooperativismo", "videoId": "1q1XjpoB6YahxzwjNqUqfallXKItNN4Lm", "coverId": "1KfqI5WbZyM4WwvLEa7HqlFqILo2SAMKK"}, {"code": "I03", "title": "Cooperar para crescer", "category": "Depoimentos", "caption": "Quando as cooperativas se unem, o produtor ganha. ☕\n\nA parceria entre CAPECA e Expocacer fortalece a intercooperação e valoriza o trabalho de quem se dedica à qualidade, safra após safra.\n\n#CAPECA #Expocacer #Intercooperacao #CafeDeQualidade", "videoId": "1ZXPJ7Kd_qzLVhOSfAPaPGkcn7K-fyyWu", "coverId": "16PRGltwV7j7Z_tfParVMh_HMzqEp02tY"}, {"code": "I04", "title": "Qualidade que se constrói", "category": "Depoimentos", "caption": "A qualidade começa muito antes da xícara.\n\nEla nasce do cuidado no campo, do esforço do produtor e de parcerias que caminham juntas. Com a Oxiquímica, celebramos o café de Campos Altos e quem trabalha para torná-lo cada vez melhor. ☕\n\n#CAPECA #Oxiquimica #CamposAltos #CafeDeQualidade", "videoId": "11oUvxc-IqFXgrXF61cCWPPblHjBtcGel", "coverId": "1EKU8vat7w2QGh2gmqXuiNE_8y_Ba_fY5"}, {"code": "I05", "title": "Qualidade que gera valor", "category": "Depoimentos", "caption": "Qualidade reconhecida. Trabalho valorizado. ☕\n\nO leilão do 10º Concurso Qualidade do Café celebrou os cafés de Campos Altos e Região. Obrigado aos produtores, finalistas, colaboradores, Conselho de Administração e parceiros que tornaram essa edição possível.\n\n#CAPECA #ConcursoQualidadeDoCafe #CafesEspeciais #CamposAltos", "videoId": "1x-gaEMowDBu1eEatZ9GsYMPBSN3cHYZG", "coverId": "1pYc3EMLZNBCHmz96r4j6481cxJBjw0JT"}, {"code": "I06", "title": "Do avô à Nova Geração", "category": "Depoimentos", "caption": "O amor pelo café também se aprende em família. 💚\n\nDas primeiras caminhadas pelo cafezal com o avô ao apoio do tio Bruno e dos pais, uma nova geração encontra nas próprias raízes a força para continuar.\n\n#CAPECA #SucessaoFamiliar #Cafeicultura #CamposAltos", "videoId": "1EU6be-Ubdpd0vvJ17Ui8HDcmkhxuccfF", "coverId": "1RRAhcHBK-RxZLIFRmXLSFiSMvc5VKdaF"}, {"code": "I07", "title": "Qualidade que merece reconhecimento", "category": "Depoimentos", "caption": "Produzir qualidade em uma safra desafiadora merece reconhecimento. ☕\n\nAo lado da Syngenta, celebramos o esforço dos cafeicultores e a busca por qualidade, inovação e produtividade. Parabéns a quem transforma cuidado em cafés especiais!\n\n#CAPECA #Syngenta #CafesEspeciais #Cafeicultura", "videoId": "1kk4VbRLFwNx1oDTRixuYvhs_jdWHbMTU", "coverId": "1jJk6Fvdbl0Hr7FZwDIGYz_-gi60F1pby"}, {"code": "I08", "title": "Café que move a região", "category": "Depoimentos", "caption": "Quando o café cresce, a região cresce junto. 💚\n\nQualidade, tecnologia e sucessão familiar abrem caminhos para valorizar os produtores, gerar renda e fortalecer Campos Altos. É por isso que cada conquista merece ser celebrada.\n\n#CAPECA #CamposAltos #Cooperativismo #Cafeicultura", "videoId": "1W99mqVrcF9bRwR57Ec_I-nog4ap_diGX", "coverId": "1ntxRD3jo7FjvngCWZnbzT2RM9OVzlR4Y"}, {"code": "I09", "title": "Memória e Futuro", "category": "Depoimentos", "caption": "Há histórias que continuam vivas em cada safra.\n\nA memória de quem dedicou a vida ao café inspira novos caminhos. Em Campos Altos, o exemplo atravessa o tempo e segue nas mãos de outros cafeicultores. ☕\n\n#CAPECA #MemoriaEFuturo #Cafeicultura #CamposAltos", "videoId": "1dhBnzJ_pwGmyV_lt3QHviEnqfQWAnJrM", "coverId": "1nEVOrjUeIdP6KDXm2QsqvW-yX1GXJ1vT"}, {"code": "I10", "title": "Quatro gerações de café", "category": "Depoimentos", "caption": "Quatro gerações, uma paixão pelo café. 💚\n\nReceber esse reconhecimento ao lado da família dá ainda mais sentido à conquista. Uma história de dedicação que continua sendo escrita, geração após geração.\n\n#CAPECA #SucessaoFamiliar #CafesEspeciais #CamposAltos", "videoId": "18JSkwDkBFObUDBRv6dnS2We3grd82NnZ", "coverId": "1lP9vWfuV12u4M_gPyksvNVwrYxo758NQ"}, {"code": "I11", "title": "Do produtor às cafeterias do mundo", "category": "Depoimentos", "caption": "Do cuidado no campo às cafeterias do mundo. ☕\n\nReconhecer os melhores cafés da região também é dar visibilidade ao trabalho e ao nome de quem produz. O concurso abre espaço para que essas histórias cheguem mais longe.\n\n#CAPECA #CafesEspeciais #CafeBrasileiro #CamposAltos", "videoId": "1Oy51lJlH9YgHYpvoJqsHq9g3jm3mJUE8", "coverId": "1YrieU4g42uhpP82-SRWCpkvMJn6yReMO"}, {"code": "D01", "title": "Qualidade merece aplausos", "category": "Discursos", "caption": "Em um ano tão difícil, produzir qualidade tem um valor ainda maior. ☕\n\nEntre os desafios do clima e o cuidado de cada dia, o trabalho do produtor fez a diferença. O reconhecimento celebra essa dedicação e a qualidade que chegou até a premiação.\n\n#CAPECA #ConcursoQualidadeDoCafe #Cafeicultura #CamposAltos", "videoId": "1IAopY6n_3VdaQgtqKbjkqcJzUyfnecHA", "coverId": "1kmYYkzviXp58kwmKvBFts3VABfluliI1"}, {"code": "D02", "title": "Por trás de cada conquista", "category": "Discursos", "caption": "Por trás de cada conquista, existem muitas pessoas. 💚\n\nOrganizadores, colaboradores da cooperativa e produtores: cada um tem seu lugar nesta história. Um reconhecimento a quem trabalha todos os dias para fazer o café de Campos Altos ir mais longe.\n\n#CAPECA #LondeERibeiro #Cooperativismo #CamposAltos", "videoId": "1glM2tdbQnSI-bjcwmyTreEBFKP5W2q7p", "coverId": "1dBhGixZglgwdQwkOn97X94fvWe4XGRIs"}],draft=false;
const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const downloadIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/></svg>';
const downloadURL=id=>'https://drive.google.com/uc?export=download&id='+encodeURIComponent(id);
document.querySelector('#videos').innerHTML=items.map(v=>{const poster=draft?v.localCover:'https://drive.google.com/thumbnail?id='+v.coverId+'&sz=w720';return `<article class="card" id="${v.code}" data-category="${v.category}"><div class="card-top"><span class="eyebrow">${v.code} · ${v.category}</span><h2>${escapeHTML(v.title)}</h2></div><div class="preview"><img class="poster" src="${poster}" alt="Capa de ${escapeHTML(v.title)}" loading="lazy" width="1080" height="1920"><button class="play" data-code="${v.code}" aria-label="Assistir: ${escapeHTML(v.title)}"><svg viewBox="0 0 72 72" fill="none" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="#154e2add" stroke="currentColor" stroke-width="2"/><path d="m29 23 21 13-21 13Z" fill="currentColor"/></svg></button></div><div class="body"><div class="downloads"><a class="download" href="${draft?v.localVideo:downloadURL(v.videoId)}" target="_blank" rel="noopener">${downloadIcon}Baixar vídeo em alta</a><a class="download secondary" href="${draft?v.localCover:downloadURL(v.coverId)}" target="_blank" rel="noopener">${downloadIcon}Baixar capa em alta</a></div><div class="caption"><div class="caption-head"><span>Legenda para Instagram</span><button type="button" class="copy" data-copy="${v.code}" aria-label="Copiar legenda de ${escapeHTML(v.title)}">Copiar</button></div><p>${escapeHTML(v.caption)}</p></div></div></article>`}).join('');
let active=null,toastTimer;
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));document.querySelectorAll('.card').forEach(c=>c.hidden=b.dataset.filter!=='Todos'&&c.dataset.category!==b.dataset.filter);if(active?.closest('.card').hidden){active.remove();active=null;}}));
document.querySelectorAll('.play').forEach(b=>b.addEventListener('click',()=>{if(active)active.remove();const v=items.find(x=>x.code===b.dataset.code),player=document.createElement(draft?'video':'iframe');if(draft){player.src=v.localVideo;player.controls=true;player.autoplay=true;player.playsInline=true;}else{player.src='https://drive.google.com/file/d/'+v.videoId+'/preview';player.title=v.title;player.allow='autoplay; fullscreen';player.allowFullscreen=true;player.referrerPolicy='strict-origin-when-cross-origin';}b.parentNode.append(player);active=player;}));
document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{const v=items.find(x=>x.code===b.dataset.copy);try{await navigator.clipboard.writeText(v.caption)}catch{const el=document.createElement('textarea');el.value=v.caption;el.style.position='fixed';el.style.opacity='0';document.body.append(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok){const range=document.createRange();range.selectNodeContents(b.closest('.caption').querySelector('p'));getSelection().removeAllRanges();getSelection().addRange(range);document.querySelector('.toast').textContent='Legenda selecionada para copiar';return;}}b.textContent='Copiado';document.querySelector('.toast').textContent='Legenda copiada';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{document.querySelector('.toast').textContent='';b.textContent='Copiar'},2500);}));
</script>
